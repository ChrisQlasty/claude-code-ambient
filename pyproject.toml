[project]
name = "claude-code-ambient"
version = "0.1.0"
description = "Turn Claude Code lifecycle events into ambient light effects on your devices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krzysztof Czuszynski" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.12",
    "zeroconf>=0.151.3",
]

[project.scripts]
ambient = "ambient.main:main"

[project.entry-points."ambient.drivers"]
console = "ambient.drivers.console:ConsoleDriver"
nanoleaf = "ambient.drivers.nanoleaf:NanoleafDriver"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambient"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
